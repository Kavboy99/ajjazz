[package]
name = "ajazz-studio"
version = "0.27.1"
edition = "2024"
description = "Independent AJAZZ peripheral studio and protocol research tools"
license = "MIT"
default-run = "ajazz-studio"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ab_glyph = "0.2"
rfd = { version = "0.15", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["blocking"] }

[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_Diagnostics_Etw", "Win32_System_Time", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }
raw-window-handle = "0.6"

[profile.release]
lto = "thin"
strip = true

[[bin]]
name = "ajazz-lab"
path = "src/bin/lab.rs"
